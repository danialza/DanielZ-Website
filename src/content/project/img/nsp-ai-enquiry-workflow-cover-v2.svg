<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071524"/>
      <stop offset="100%" stop-color="#0f2c43"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9fd"/>
      <stop offset="100%" stop-color="#e7f1f8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66d5c1"/>
      <stop offset="100%" stop-color="#7ca8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05101b" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5c7d"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="88" y="168" font-family="Arial, sans-serif" font-size="54" font-weight="600" fill="#7ab1ff">AI Workflow</text>
  <text x="88" y="298" font-family="Arial, sans-serif" font-size="86" font-weight="700" fill="#f6fbff">NSP Enquiry</text>
  <text x="88" y="392" font-family="Arial, sans-serif" font-size="86" font-weight="700" fill="#f6fbff">JSON Extractor</text>
  <text x="88" y="468" font-family="Arial, sans-serif" font-size="46" fill="#a8c7dc">Python + LLM Intake System</text>
  <rect x="88" y="504" width="520" height="7" rx="4" fill="url(#chip)"/>
  <text x="88" y="574" font-family="Arial, sans-serif" font-size="35" fill="#d2e6f5">Email -> AI Extraction -> Structured Output</text>

  <g filter="url(#softShadow)">
    <rect x="760" y="150" width="760" height="600" rx="22" fill="#102a3f"/>
    <rect x="786" y="176" width="708" height="548" rx="14" fill="url(#panel)" stroke="#d2e4f2" stroke-width="2"/>
    <g transform="translate(788 241) scale(0.44)">
      <rect width="1600" height="950" fill="#eef6fb"/>
      <text x="90" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#10293b">NSP Enquiry Workflow Flowchart</text>

      <rect x="90" y="170" width="300" height="150" rx="18" fill="#d9ecfb" stroke="#6ea6cc" stroke-width="3"/>
      <text x="130" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Incoming Email</text>
      <text x="130" y="275" font-family="Arial, sans-serif" font-size="20" fill="#33556f">Customer request</text>

      <rect x="470" y="170" width="300" height="150" rx="18" fill="#ddeff0" stroke="#74a7aa" stroke-width="3"/>
      <text x="498" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Load + Prompt Step</text>
      <text x="520" y="275" font-family="Arial, sans-serif" font-size="20" fill="#33556f">System + extraction prompt</text>

      <rect x="850" y="170" width="300" height="150" rx="18" fill="#e7e7fb" stroke="#8b90d5" stroke-width="3"/>
      <text x="920" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">LLM Extraction</text>
      <text x="885" y="275" font-family="Arial, sans-serif" font-size="20" fill="#33556f">Parse dimensions and needs</text>

      <rect x="1230" y="170" width="280" height="150" rx="18" fill="#e3f5e9" stroke="#67b083" stroke-width="3"/>
      <text x="1270" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Structured JSON</text>
      <text x="1272" y="275" font-family="Arial, sans-serif" font-size="20" fill="#33556f">Standard schema output</text>

      <polygon points="700,500 910,390 1120,500 910,610" fill="#fff4dc" stroke="#d4a44e" stroke-width="3"/>
      <text x="835" y="495" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Confidence</text>
      <text x="828" y="530" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Check</text>

      <rect x="630" y="700" width="300" height="140" rx="18" fill="#fde7e7" stroke="#d68585" stroke-width="3"/>
      <text x="690" y="770" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">Human Review</text>
      <text x="680" y="805" font-family="Arial, sans-serif" font-size="20" fill="#33556f">Fix missing details</text>

      <rect x="1010" y="700" width="410" height="140" rx="18" fill="#e4f3ff" stroke="#76a5c9" stroke-width="3"/>
      <text x="1060" y="770" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f2436">ERP / MRP / CRM Intake</text>
      <text x="1070" y="805" font-family="Arial, sans-serif" font-size="20" fill="#33556f">Quote and operations handoff</text>

      <line x1="390" y1="245" x2="470" y2="245" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="770" y1="245" x2="850" y2="245" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="1150" y1="245" x2="1230" y2="245" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>

      <line x1="1370" y1="320" x2="980" y2="430" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="910" y1="610" x2="780" y2="700" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="1010" y1="770" x2="930" y2="770" stroke="#4a7da0" stroke-width="5"/>
      <line x1="1120" y1="500" x2="1210" y2="700" stroke="#4a7da0" stroke-width="5" marker-end="url(#arrow)"/>

      <text x="1145" y="610" font-family="Arial, sans-serif" font-size="22" fill="#45647d">High confidence</text>
      <text x="690" y="640" font-family="Arial, sans-serif" font-size="22" fill="#45647d">Low confidence</text>
    </g>
  </g>
</svg>
