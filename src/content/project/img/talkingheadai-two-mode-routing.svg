<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">TalkingHeadAI Two-Mode Routing</title>
  <desc id="desc">Decision logic for known-answer route versus RAG-generated response route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1628"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#213759"/>
      <stop offset="100%" stop-color="#172b44"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="70" y="95" fill="#e5efff" font-size="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Two-Mode Query Routing</text>
  <text x="70" y="140" fill="#a8c9ff" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Similarity score controls whether the system returns approved knowledge or generates a new response.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="620" y="210" width="360" height="110" rx="16" fill="url(#box)" stroke="#90c2ff"/>
    <text x="800" y="275" fill="#dcecff" font-size="30" font-weight="700" text-anchor="middle">Embed User Query</text>

    <rect x="620" y="380" width="360" height="110" rx="16" fill="url(#box)" stroke="#90c2ff"/>
    <text x="800" y="445" fill="#dcecff" font-size="30" font-weight="700" text-anchor="middle">Search Qdrant</text>

    <polygon points="800,540 980,650 800,760 620,650" fill="url(#box)" stroke="#90c2ff" stroke-width="2"/>
    <text x="800" y="648" fill="#dcecff" font-size="28" font-weight="700" text-anchor="middle">score &gt;= threshold?</text>

    <rect x="230" y="620" width="300" height="140" rx="16" fill="url(#box)" stroke="#7fe2c1"/>
    <text x="380" y="680" fill="#dbfff2" font-size="28" font-weight="700" text-anchor="middle">Case B</text>
    <text x="380" y="715" fill="#dbfff2" font-size="22" text-anchor="middle">Return approved answer</text>

    <rect x="1070" y="620" width="300" height="140" rx="16" fill="url(#box)" stroke="#ffcf9d"/>
    <text x="1220" y="680" fill="#fff2e2" font-size="28" font-weight="700" text-anchor="middle">Case A</text>
    <text x="1220" y="715" fill="#fff2e2" font-size="22" text-anchor="middle">RAG context + LLM</text>

    <rect x="620" y="810" width="360" height="90" rx="14" fill="url(#box)" stroke="#90c2ff"/>
    <text x="800" y="865" fill="#dcecff" font-size="28" font-weight="700" text-anchor="middle">Unified Response Output</text>
  </g>

  <g stroke="#b7d5ff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M800 320 L800 380"/>
    <path d="M800 490 L800 540"/>
    <path d="M620 650 L530 650"/>
    <path d="M980 650 L1070 650"/>
    <path d="M380 760 L680 810"/>
    <path d="M1220 760 L920 810"/>
  </g>

  <text x="560" y="625" fill="#7fe2c1" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">YES</text>
  <text x="1000" y="625" fill="#ffcf9d" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">NO</text>
</svg>
