<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">TalkingHeadAI Architecture Flow</title>
  <desc id="desc">High-level architecture showing frontend, backend, databases, vector store, cache, and external AI services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#142d4c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3553"/>
      <stop offset="100%" stop-color="#132942"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>

  <text x="70" y="95" fill="#e2ecff" font-size="54" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">TalkingHeadAI - System Architecture</text>
  <text x="70" y="140" fill="#9ec2ff" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Real-time voice and text conversation with retrieval routing, memory, and avatar playback.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="210" width="320" height="190" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="110" y="270" fill="#dbeafe" font-size="30" font-weight="700">Frontend</text>
    <text x="110" y="312" fill="#bdd8ff" font-size="22">Next.js + React</text>
    <text x="110" y="344" fill="#bdd8ff" font-size="22">WebSocket + UI</text>

    <rect x="510" y="210" width="400" height="260" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="540" y="270" fill="#dbeafe" font-size="32" font-weight="700">Backend Orchestrator</text>
    <text x="540" y="312" fill="#bdd8ff" font-size="22">FastAPI + Python</text>
    <text x="540" y="344" fill="#bdd8ff" font-size="22">Routing + Memory + RAG</text>
    <text x="540" y="376" fill="#bdd8ff" font-size="22">Case A / Case B decision</text>
    <text x="540" y="408" fill="#bdd8ff" font-size="22">Provider adapters</text>

    <rect x="1010" y="210" width="500" height="300" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="1040" y="270" fill="#dbeafe" font-size="32" font-weight="700">External AI Services</text>
    <text x="1040" y="312" fill="#bdd8ff" font-size="22">LLM: Claude / Ollama</text>
    <text x="1040" y="344" fill="#bdd8ff" font-size="22">STT: Deepgram / Whisper</text>
    <text x="1040" y="376" fill="#bdd8ff" font-size="22">TTS: ElevenLabs / OpenAI</text>
    <text x="1040" y="408" fill="#bdd8ff" font-size="22">Avatar: D-ID / SadTalker</text>
    <text x="1040" y="440" fill="#bdd8ff" font-size="22">Embeddings: OpenAI / Local</text>

    <rect x="260" y="590" width="320" height="200" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="290" y="650" fill="#dbeafe" font-size="30" font-weight="700">PostgreSQL</text>
    <text x="290" y="692" fill="#bdd8ff" font-size="22">Conversations</text>
    <text x="290" y="724" fill="#bdd8ff" font-size="22">User facts</text>

    <rect x="650" y="590" width="300" height="200" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="680" y="650" fill="#dbeafe" font-size="30" font-weight="700">Qdrant</text>
    <text x="680" y="692" fill="#bdd8ff" font-size="22">Vector search</text>
    <text x="680" y="724" fill="#bdd8ff" font-size="22">Approved QA</text>

    <rect x="1020" y="590" width="280" height="200" rx="18" fill="url(#card)" stroke="#5f9ad8"/>
    <text x="1050" y="650" fill="#dbeafe" font-size="30" font-weight="700">Redis</text>
    <text x="1050" y="692" fill="#bdd8ff" font-size="22">Session state</text>
    <text x="1050" y="724" fill="#bdd8ff" font-size="22">Queue + cache</text>
  </g>

  <g stroke="#8dc2ff" stroke-width="4" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M400 305 L510 305"/>
    <path d="M910 320 L1010 320"/>
    <path d="M700 470 L700 590"/>
    <path d="M760 470 L800 590"/>
    <path d="M840 470 L1140 590"/>
  </g>
</svg>
