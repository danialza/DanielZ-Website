<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">TalkingHeadAI Memory and Quality Loop</title>
  <desc id="desc">Two loops: long-term user memory personalization and unanswered question quality improvement loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f293f"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3f60"/>
      <stop offset="100%" stop-color="#223551"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="70" y="95" fill="#eef5ff" font-size="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Memory and Knowledge Quality Loops</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="120" y="170" fill="#91f0cf" font-size="30" font-weight="700">Loop A: User Memory Personalization</text>
    <rect x="120" y="220" width="300" height="100" rx="14" fill="url(#box)" stroke="#91f0cf"/>
    <text x="270" y="280" fill="#defdf2" font-size="24" text-anchor="middle">Conversation Input</text>

    <rect x="500" y="220" width="300" height="100" rx="14" fill="url(#box)" stroke="#91f0cf"/>
    <text x="650" y="280" fill="#defdf2" font-size="24" text-anchor="middle">Extract Facts</text>

    <rect x="880" y="220" width="300" height="100" rx="14" fill="url(#box)" stroke="#91f0cf"/>
    <text x="1030" y="280" fill="#defdf2" font-size="24" text-anchor="middle">Store in PostgreSQL</text>

    <rect x="1260" y="220" width="220" height="100" rx="14" fill="url(#box)" stroke="#91f0cf"/>
    <text x="1370" y="280" fill="#defdf2" font-size="24" text-anchor="middle">Inject to Prompt</text>

    <text x="120" y="500" fill="#ffd39e" font-size="30" font-weight="700">Loop B: Knowledge Quality Improvement</text>

    <rect x="120" y="550" width="300" height="110" rx="14" fill="url(#box)" stroke="#ffd39e"/>
    <text x="270" y="615" fill="#fff2e3" font-size="22" text-anchor="middle">Low-confidence Query</text>

    <rect x="500" y="550" width="300" height="110" rx="14" fill="url(#box)" stroke="#ffd39e"/>
    <text x="650" y="615" fill="#fff2e3" font-size="22" text-anchor="middle">Queue Unanswered</text>

    <rect x="880" y="550" width="300" height="110" rx="14" fill="url(#box)" stroke="#ffd39e"/>
    <text x="1030" y="615" fill="#fff2e3" font-size="22" text-anchor="middle">Review + Answer</text>

    <rect x="1260" y="550" width="220" height="110" rx="14" fill="url(#box)" stroke="#ffd39e"/>
    <text x="1370" y="615" fill="#fff2e3" font-size="22" text-anchor="middle">Re-index QA</text>
  </g>

  <g stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M420 270 L500 270" stroke="#91f0cf"/>
    <path d="M800 270 L880 270" stroke="#91f0cf"/>
    <path d="M1180 270 L1260 270" stroke="#91f0cf"/>
    <path d="M1370 320 C 1370 420, 270 420, 270 320" stroke="#91f0cf"/>

    <path d="M420 605 L500 605" stroke="#ffd39e"/>
    <path d="M800 605 L880 605" stroke="#ffd39e"/>
    <path d="M1180 605 L1260 605" stroke="#ffd39e"/>
    <path d="M1370 660 C 1370 780, 270 780, 270 660" stroke="#ffd39e"/>
  </g>
</svg>
